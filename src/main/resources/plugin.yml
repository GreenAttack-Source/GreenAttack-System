      system.market.use: true
  system.rank:
    description: Allows managing the rank market and includes rank purchasing.
    default: false
    children:
      system.rank.use: true
  system.rank.use:
    description: Allows opening the rank market and purchasing ranks with crystals.
    default: false
  system.playtime.admin:
    description: Allows viewing another player's network-wide playtime.
    default: false
