    default: false
  system.gamemode.adventure:
    description: Allows switching your own game mode to adventure.
    default: false
  system.gamemode.spectator:
    description: Allows switching your own game mode to spectator.
    default: false
  system.gamemode.other:
    description: Allows targeting another online player with gamemode commands.
    default: false
  system.gamemode.admin:
    description: Allows all GreenAttack gamemode commands for self and other players.
    default: op
    children:
      system.gamemode: true
      system.gamemode.survival: true
      system.gamemode.creative: true
      system.gamemode.adventure: true
      system.gamemode.spectator: true
      system.gamemode.other: true
  system.pay:
    description: Allows sending money to online players on this Paper server.
    default: false
  system.pay.admin:
