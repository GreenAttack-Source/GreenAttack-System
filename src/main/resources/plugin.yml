name: GreenAttack-System
version: '${version}'
main: de.greenattack.system.GreenAttackSystemPlugin
api-version: '1.21'
description: GreenAttack utility features and permission-based full-server join bypass.
author: GreenAttack
softdepend: [LuckPerms, Vault, Essentials, EssentialsSpawn, PlaceholderAPI, NBTAPI]
libraries:
  - com.mysql:mysql-connector-j:8.4.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.3
commands:
  greenattack:
    description: Serverweite Admin-Befehle des GreenAttack-Systems.
    usage: /greenattack <reload|slots <anzahl>>
    permission: system.admin
    permission-message: "Dafür hast du keine Berechtigung."
  slots:
    description: Ändert das Spielerlimit dieses Paper-Servers.
    usage: /slots <anzahl>
    permission: system.admin
    permission-message: "Dafür hast du keine Berechtigung."
  isign:
    description: Signiert das Item in deiner Hand.
    usage: /isign [Spieler]
  news:
    description: Zeigt die GreenAttack-Neuigkeiten.
    aliases: [updates]
    usage: /news
  newsconfig:
    description: Verwaltet die GreenAttack-Neuigkeiten.
    usage: /newsconfig <add|delete|clear>
  tpa:
    description: Sendet eine Teleport-Anfrage.
    usage: /tpa <Spieler>
  tpaaccept:
    description: Nimmt eine Teleport-Anfrage an.
    usage: /tpaaccept
  tpacancel:
    description: Lehnt eine Teleport-Anfrage ab.
    usage: /tpacancel
  tpaauto:
    description: Schaltet das automatische Annehmen von TPA-Anfragen um.
    usage: /tpaauto
  tpalookup:
    description: Zeigt die letzten TPA- und TP-Teleports an.
    usage: /tpalookup
  tpahere:
    description: Bittet einen Spieler, sich zu dir zu teleportieren.
    aliases: [tpah]
    usage: /tpahere <Spieler>
  tphere:
    description: Teleportiert einen Spieler zu dir.
    aliases: [tph]
    usage: /tphere <Spieler>
  tp:
    description: Teleportiert dich zu einem Spieler oder einen Spieler zu einem anderen.
    aliases: [gctp]
    usage: /tp <Spieler> [Zielspieler]
  db:
    description: Öffnet die Item-Datenbank.
    usage: /db [hand]
  halloween:
    description: Verwaltet das Halloween-Kopf-Event.
    usage: /halloween [set [skull]|reset]
  monitoring:
    description: Schaltet das Actionbar-Monitoring um oder ändert das Layout.
    aliases: [mon]
    usage: /monitoring [help|off|reset|elemente]
  performance:
    description: Schaltet den globalen Performance-Anzeigemodus um.
    aliases: [perf]
    usage: /performance
  booster:
    description: Öffnet das GreenAttack-Booster-Menü.
    aliases: [boosters]
    usage: /booster
  boostergive:
    description: Gibt einem Spieler Booster.
    usage: /boostergive <Spieler> <break|drop|xp> <Anzahl>
  one-klick:
    description: Aktiviert One-Klick auf der gehaltenen Axt oder Spitzhacke.
    usage: /one-klick
    aliases: [oneclick]
  gamemode:
    description: Ändert den eigenen Spielmodus oder mit Berechtigung den eines Spielers.
    usage: /gamemode <survival|creative|adventure|spectator> [Spieler]
    aliases: [gm, gms, gmc, gma, gmsp, gm0, gm1, gm2, gm3]
  fly:
    description: Schaltet persönliches Fliegen um oder verwaltet es für Spieler.
    usage: /fly [Spieler]
  msg:
    description: Sendet eine private Nachricht an einen Spieler auf diesem Server.
    aliases: [tell, w, whisper]
    usage: /msg <Spieler> <Nachricht>
  msglogs:
    description: Zeigt die gespeicherten privaten Nachrichten.
    usage: /msglogs [Seite]
  invsee:
    description: Öffnet das Inventar eines Spielers (offline über OpenInv).
    aliases: [inv]
    usage: /inv <Spieler>
  ecsee:
    description: Öffnet die Endertruhe eines Spielers (offline über OpenInv).
    usage: /ecsee <Spieler>
  ec:
    description: Öffnet deine eigene Endertruhe.
    usage: /ec
  claim:
    description: Sichert deinen aktuellen Chunk und verwaltet vertraute Spieler.
    aliases: [claims, land]
    usage: /claim [trust|settings|unclaim|info|help]
  spawn:
    description: Teleportiert dich oder einen Spieler zum Spawn.
    usage: /spawn [Spieler]
    aliases: [espawn]
  rtp:
    description: Teleportiert dich an einen sicheren Zufallsort in deiner aktuellen Welt.
    usage: /rtp
    permission: system.rtp
    permission-message: "Dafür hast du keine Berechtigung."
  market:
    description: Öffnet den dynamischen GreenAttack-Markt mit Kategorien.
    aliases: [markt]
    usage: /markt [reload|reset [Kategorie]]
    permission: system.market.use
    permission-message: "Dafür hast du keine Berechtigung."
  setspawn:
    description: Setzt den Standard- oder einen Gruppenspawn.
    usage: /setspawn [Gruppe]
    aliases: [esetspawn]
  haupt-world:
    description: Setzt die aktuelle Welt als Server-Hauptwelt für den nächsten Neustart.
    usage: /haupt-world
  pay:
    description: Sendet Geld an einen Spieler auf diesem Paper-Server.
    usage: /pay <Spieler> <Betrag|1k|1m>
  payinfo:
    description: Zeigt die letzten lokalen Economy-Zahlungen.
    usage: /payinfo [Anzahl]
  eco:
    description: Verwaltet die GreenAttack-Guthaben.
    usage: /eco <give|take|set|reset|balance> <Spieler> [Betrag|1k|1m]
  balance:
    description: Zeigt dein GreenAttack-Guthaben.
    usage: /balance [Spieler]
    aliases: [bal]
  balancetop:
    description: Zeigt die höchsten GreenAttack-Guthaben.
    usage: /balancetop
    aliases: [baltop]
  sell:
    description: Öffnet ein Menü zum Verkaufen ausgewählter Items.
    usage: /sell
    permission: system.sell
    permission-message: "Dafür hast du keine Berechtigung."
  rank:
    description: Öffnet den konfigurierbaren Rangmarkt.
    aliases: [ränge]
    usage: /rank [reload]
    permission: system.rank.use
    permission-message: "Dafür hast du keine Berechtigung."
  kit:
    description: Speichert das Starterkit für neue Spieler.
    usage: /kit set
    permission: system.kit.admin
    permission-message: "Dafür hast du keine Berechtigung."
  playtime:
    description: Zeigt die eigene oder mit Admin-Berechtigung die Spielzeit eines Spielers.
    aliases: [pt]
    usage: /playtime [Spieler]
  aktionshaus:
    description: Öffnet das Aktionshaus und verwaltet Angebote.
    aliases: [ah]
    usage: /aktionshaus [suche|verkaufen|meine|abbrechen|admin|reload]
  ka:
    description: Verwaltet Kristallkonten.
    usage: /ka <give|set|take> <Spieler> <Anzahl|1k|1m> | /ka reset <Spieler>
  kristall:
    description: Verwaltet Kristallkonten.
    usage: /kristall <give|set|take> <Spieler> <Anzahl|1k|1m> | /kristall reset <Spieler>
  kristalle:
    description: Verwaltet Kristallkonten.
    usage: /kristalle <give|set|take> <Spieler> <Anzahl|1k|1m> | /kristalle reset <Spieler>
  home:
    description: Listet Homes auf oder teleportiert zu einem Home.
    usage: /home [name]
    aliases: [h]
  sethome:
    description: Speichert ein Home.
    usage: /sethome [name]
    aliases: [seth]
  delhome:
    description: Löscht ein Home.
    usage: /delhome [name]
    aliases: [delh]
  renamehome:
    description: Benennt ein Home um.
    usage: /renamehome <alt> <neu>
    aliases: [rh]
  homeadmin:
    description: Teleportiert einen Administrator zu einem fremden Home.
    usage: /homeadmin [set|remove] <Spieler> [Home]

  code:
    description: Löst einen Code ein (nur ein Code pro Spieler).
    usage: /code <Code>
  codecreate:
    description: Erstellt einen neuen Code, optional mit Belohnungs-Befehl.
    usage: /codecreate <Code> [Belohnungs-Befehl]
  codeconfig:
    description: Zeigt, fügt hinzu, entfernt oder ändert die Belohnungen eines Codes.
    usage: /codeconfig <Code> [add|remove|set] ...
  codereset:
    description: Setzt den eingelösten Code eines Spielers zurück (zum Testen).
    usage: /codereset <Spieler>
  codedelete:
    description: Löscht einen Code.
    usage: /codedelete <Code>
  codetop:
    description: Zeigt die meistgenutzten Codes.
    usage: /codetop
  clan:
    description: Clan-System (erstellen, einladen, Chat, Farbe ...).
    usage: /clan help
  clanadmin:
    description: Clan-Verwaltung für Admins.
    usage: /clanadmin <disband|kick|settag|setcolor> ...
  cc:
    description: Schreibt eine Nachricht an deinen Clan.
    usage: /cc <Nachricht>
  customcmd:
    description: Verwaltet die eigenen Befehle aus create-cmd's.
    usage: /customcmd <list|reload|create|delete>
permissions:
  system.admin:
    description: Administrative Vollberechtigung für alle GreenAttack-System-Funktionen.
    default: false
    children:
      system.isign: true
      system.isign.admin: true
      system.news.view: true
      system.news.config: true
      system.tpa.admin: true
      system.tp: true
      system.tp.here: true
      system.tpa.here: true
      system.db.admin: true
      system.halloween.admin: true
      system.monitoring.admin: true
      system.monitoring.use: true
      system.booster.use: true
      system.booster.admin: true
      system.pay.admin: true
      system.eco: true
      system.eco.balance: true
      system.oneclick.admin: true
      system.gamemode.admin: true
      system.fly: true
      system.fly.use: true
      system.fly.admin: true
      system.fly.other: true
      system.msg.use: true
      system.msg.see: true
      system.spawn.admin: true
      system.aktionshaus.admin: true
      system.kristall.admin: true
      kristallsystem.admin: true
      system.home.admin: true
      system.playtime.admin: true
      system.kit.admin: true
      system.code.use: true
      system.code.top: true
      system.code.admin: true
      system.clan.use: true
      system.clan.create: true
      system.clan.color: true
      system.clan.admin: true
      system.customcmd.admin: true
      system.anticheat.alerts: true
  system.anticheat.alerts:
    description: Receives alerts when players break ore blocks without a clear line of sight.
    default: false
  system.kit.admin:
    description: Allows setting the GreenAttack starter kit with /kit set.
    default: false
  system.code.use:
    description: Allows redeeming one code per player with /code.
    default: false
  system.code.top:
    description: Allows viewing the most used codes with /codetop.
    default: false
  system.code.admin:
    description: Allows creating, configuring, deleting and resetting codes with /codecreate, /codeconfig, /codedelete and /codereset.
    default: false
    children:
      system.code.use: true
      system.code.top: true
  system.clan.use:
    description: Allows using the clan commands (/clan, /cc).
    default: false
  system.clan.create:
    description: Allows creating a clan with /clan create.
    default: false
  system.clan.color:
    description: Allows changing the clan tag color with /clan color.
    default: false
  system.clan.admin:
    description: Allows clan administration with /clanadmin.
    default: false
    children:
      system.clan.use: true
  clan.delete.confirm.bypass:
    description: Bypasses the 60-second expiry after /clan delete; a pending request is still required.
    default: false
  system.customcmd.admin:
    description: Allows managing custom commands created with create-cmd's (/customcmd).
    default: false
  system.db.use:
    description: Allows opening the item database and taking items.
    default: false
  system.db.add:
    description: Allows adding the held item to the item database.
    default: false
    children:
      system.db.use: true
  system.db.admin:
    description: Allows deleting items from the item database.
    default: false
    children:
      system.db.use: true
      system.db.add: true
  system.halloween.user:
    description: Allows viewing progress and collecting Halloween heads.
    default: false
  system.halloween.set:
    description: Allows setting the Halloween skull template and receiving event heads.
    default: false
  system.halloween.reset:
    description: Allows resetting the Halloween event with /halloween reset.
    default: false
  system.halloween.admin:
    description: Allows all Halloween event actions.
    default: false
    children:
      system.halloween.user: true
      system.halloween.set: true
      system.halloween.reset: true
  system.monitoring.use:
    description: Allows using /monitoring.
    default: false
  system.monitoring.admin:
    description: Allows toggling the global monitoring display mode.
    default: false
    children:
      system.monitoring.use: true
  system.booster.use:
    description: Allows opening and using the GreenAttack booster menu.
    default: false
  system.booster.admin:
    description: Allows giving boosters to players.
    default: false
    children:
      system.booster.use: true
  system.oneclick.admin:
    description: Allows marking an axe or pickaxe for One-Klick.
    default: op
  system.fly:
    description: Legacy permission for personal flight; kept for compatibility.
    default: false
    children:
      system.fly.use: true
  system.fly.use:
    description: Allows toggling personal flight in survival and adventure mode with /fly.
    default: false
  system.fly.other:
    description: Allows toggling flight for another online player with /fly <player>.
    default: false
  system.fly.admin:
    description: Allows using /fly and managing flight for other players.
    default: false
    children:
      system.fly: true
      system.fly.use: true
      system.fly.other: true
  system.msg.use:
    description: Allows sending private messages with /msg.
    default: false
  system.msg.see:
    description: Allows viewing private message logs with /msglogs.
    default: false
  system.invsee:
    description: Allows viewing another online player's inventory with /inv and /invsee.
    default: false
  system.invsee.modify:
    description: Allows modifying the inventory opened with /invsee.
    default: false
  system.ecsee:
    description: Allows viewing another online player's ender chest with /ecsee.
    default: false
  system.ecsee.modify:
    description: Allows modifying the ender chest opened with /ecsee.
    default: false
  system.ec:
    description: Allows opening your own ender chest with /ec.
    default: false
  claim.use:
    description: Allows using the basic chunk-claim command.
    default: true
  claim.claims.1:
    description: Example claim limit node; grant claim.claims.N for any positive numeric limit.
    default: false
  claim.claims.unlimited:
    description: Removes the configured limit on the number of personal claims.
    default: false
  claim.unclaim:
    description: Allows unclaiming your own chunk.
    default: true
  claim.trust.add:
