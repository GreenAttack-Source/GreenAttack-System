    default: op
    children:
      system.spawn.set: true
  system.spawn.group.*:
    description: Allows using every configured group-specific spawn.
    default: false
  system.spawn.admin:
    description: Allows all GreenAttack spawn commands and keeps the last location on join.
    default: op
    children:
      system.spawn: true
      system.spawn.others: true
      system.spawn.set: true
      system.spawn.set.group: true
  system.gamemode:
    description: Allows using /gamemode to change your own game mode.
