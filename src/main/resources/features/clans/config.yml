enabled: true

# ---------------------------------------------------------------------------
# Datenbank (PFLICHT). Alle Paper-Server, die dieselbe Datenbank nutzen, teilen sich
# dieselben Clans. Trag deine Zugangsdaten ein und setze enabled auf true.
# Tabellen (werden automatisch angelegt): <table-prefix>clans, clan_members, clan_roles, clan_homes
# ---------------------------------------------------------------------------
database:
  enabled: false
  type: mysql          # mysql oder mariadb
  host: localhost
  port: 3306
  name: greenattack
  user: ""
  password: ""
  table-prefix: gc_
  jdbc-url: ""         # optional, ersetzt host/port/name komplett

# ---------------------------------------------------------------------------
# Clan-Homes
# ---------------------------------------------------------------------------
# Wie viele Homes ein Clan haben darf.
max-homes: 3
# Name DIESES Servers, genau so wie in Velocity (zum Beispiel citybuild). Damit funktioniert
# /clan home auch von einem anderen Server aus (braucht GreenAttack-System-Velocity ab 1.1.17).
# Leer lassen = Homes gelten nur auf dem Server, auf dem sie gesetzt wurden.
server-id: ""

# ---------------------------------------------------------------------------
# Rollen (liegen in der Datenbank, nicht in LuckPerms)
# Jeder Clan hat die Rollen Owner und Member. Beide sind nicht loeschbar.
# Owner steht immer ueber allen eigenen Rollen, Member immer darunter.
# ---------------------------------------------------------------------------
owner-weight: 1000
member-weight: 1
max-roles: 10                 # eigene Rollen pro Clan
# Rechte der Standardrolle Member fuer NEUE Clans. Moeglich:
# roles_view, roles_edit, members_view, invite, kick, role_assign, home_use, home_set,
# plot, tasks, color, rename, tag, settings
default-member-permissions:
  - members_view
  - roles_view
  - home_use

# Beitritt fuer neue Clans: invite, open oder closed (bei /clan settings join auch als close nutzbar)
default-join-mode: invite

# ---------------------------------------------------------------------------
# Preise
# ---------------------------------------------------------------------------
create-cost: 250000          # Economy-Dollar fuer /clan create; alternativ "free" fuer kostenlose Gruendung
rename-cost: 0               # Economy-Dollar fuer eine Namensaenderung (0 = gratis)
color-cost-normal: 100       # Kristalle fuer eine Farbe wie pink, gold, aqua ...
color-cost-hex: 250          # Kristalle fuer eine freie Hex-Farbe wie #ff8800

# ---------------------------------------------------------------------------
# Aussehen: der Tag erscheint immer in GROSSBUCHSTABEN als [TAG].
# ---------------------------------------------------------------------------
default-color: pink          # Farbe neuer Clans (Name oder #RRGGBB)
bracket-color: "&7"

# Regeln
name:
  min: 3
  max: 16
tag:
  min: 2
  max: 5
max-members: 20
invite-expire-seconds: 60
list-size: 30
top-size: 10
cache-refresh-seconds: 30    # wie oft Aenderungen anderer Server uebernommen werden (Neustart noetig)

# LuckPerms-Suffix: Der Clan-Tag erscheint in seiner eingestellten Clan-Farbe mit Prioritaet 0.
luckperms-suffix:
  enabled: true
  format: " [%tag%]"
  applied: {}

# Placeholder (PlaceholderAPI):
#   %clan_tag%        z. B. [WLF] in Clan-Farbe
#   %clan_tag_plain%  nur der Tag-Text ohne Farben und Klammern
#   %clan_name%       Clan-Name
#   %clan_role%       Eigene Clan-Rolle
#   %clan_members%    Mitgliederzahl
# Ohne Clan sind alle Placeholder leer.

