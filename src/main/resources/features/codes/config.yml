enabled: true

# Wie viele Codes /codetop anzeigt (1 bis 50).
top-size: 10

# ---------------------------------------------------------------------------
# Speicher. Standard: lokale Dateien (codes.tsv, redeemed.tsv) in diesem Ordner.
# Mit enabled: true werden Codes und Einlösungen in MySQL/MariaDB gespeichert.
# Dann gilt "ein Code pro Spieler" auf ALLEN Servern, die dieselbe Datenbank nutzen.
# Die Tabellen <table-prefix>codes und <table-prefix>code_redemptions werden
# automatisch angelegt. Lokale Dateien werden dabei NICHT übernommen.
# ---------------------------------------------------------------------------
database:
  enabled: false
  type: mysql          # mysql oder mariadb
  host: localhost
  port: 3306
  name: greenattack
  user: ""
  password: ""
  table-prefix: gc_
  jdbc-url: ""         # optional, ersetzt host/port/name komplett

# Jeder Spieler kann insgesamt nur EINEN Code einlösen, egal welchen.
# Befehle:
#   /code <Code>                              Code einlösen
#   /codecreate <Code> [/Befehl mit %player%]  Code erstellen (mehrere Befehle mit ;; trennen)
#   /codeconfig <Code>                         Belohnungen des Codes mit Nummern anzeigen
#   /codeconfig <Code> add <Befehl>            Belohnung hinzufügen
#   /codeconfig <Code> remove <Nummer|Befehl>  Belohnung entfernen
#   /codeconfig <Code> set <Nummer> <Befehl>   Belohnung mit dieser Nummer ändern
#   /codereset <Spieler>                       eingelösten Code eines Spielers zurücksetzen (Test)
#   /codedelete <Code>                         Code löschen
#   /codetop                                   meistgenutzte Codes
# Platzhalter in Belohnungen: %player% und %uuid%. Sie laufen als Konsolenbefehl.

