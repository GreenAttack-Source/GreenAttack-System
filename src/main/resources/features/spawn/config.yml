  spawn-usage: "&7Verwendung: &f/spawn [Spieler]"
  setspawn-usage: "&7Verwendung: &f/setspawn [Gruppe]"
  invalid-group: "&cDer Gruppenname darf nur Buchstaben, Zahlen, _ und - enthalten."
  player-not-found: "&cSpieler &e%player% &cwurde nicht gefunden."
  not-set: "&cDer Spawn wurde noch nicht gesetzt."
