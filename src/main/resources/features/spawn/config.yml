enabled: true

# Add exact player names here to give those players their own spawn priority.
# Create each player's spawn with /setspawn <playername>.
player-priority: []

# Add LuckPerms group names here, highest priority first.
# Create each matching group spawn with /setspawn <groupname>.
# No system.spawn.group.<group> permission is needed when LuckPerms is active.
group-priority: []

# Players without system.spawn.admin are sent to their configured spawn on every join.
# Players with system.spawn.admin keep their last location when rejoining.
respawn-at-spawn: true

notify-target: true

messages:
  disabled: "&cDas Spawn-Feature ist deaktiviert."
