  setting-too-long: "&cTitel und Untertitel dürfen höchstens 80 Zeichen lang sein."
  setting-saved: "&aTitel/Untertitel gespeichert. Änderungen sind kostenlos."
  info: "&aClaim von &e%owner%&a. Vertraut: &f%trusted%"
