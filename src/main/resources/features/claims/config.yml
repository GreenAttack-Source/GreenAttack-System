enabled: true

permissions:
  use: "claim.use"

# Der Standard erlaubt zehn Claims pro Spieler; den Kaufpreis je Chunk stellst du unten ein.
# Ein LuckPerms-Recht claim.claims.N setzt das persönliche Maximum auf N.
# Erlaubt sind beliebige positive Zahlen; den höchsten vergebenen Wert gewinnt.
# claim.claims.unlimited hebt das Limit auf. Ohne Zahlen-Recht gilt der Config-Standard.
max-claims-per-player: 10
disabled-worlds: []

cost:
  claim: free # `free` or an Economy amount charged per claimed chunk

actionbar:
  enabled: true
  # %spieler% ist der Claim-Besitzer. %(plugin)prefix% wird durch den Plugin-Prefix ersetzt.
  format: "%(plugin)prefix% | Chunk -> %spieler%%claims%"
  # Wird nur bei zusammenhängenden Claims desselben Besitzers angezeigt.
  multiple-claims-format: " &8(&f%count%&7 verbundene Claims&8)"

# Diese Standardtexte erscheinen beim Betreten eines Claims, sofern dort kein eigener Text gesetzt ist.
defaults:
  title: "&2Claim von %owner%"
  subtitle: "&7Dieser Chunk ist geschützt."

title:
  fade-in: 5
  stay: 45
  fade-out: 10

messages:
  disabled: "&cDas Claim-Feature ist deaktiviert."
  no-permission: "&cDafür hast du keine Berechtigung."
  player-only: "&cDiesen Befehl können nur Spieler verwenden."
  world-disabled: "&cClaims sind in dieser Welt deaktiviert."
  claimed: "&aChunk gesichert. &7Claims: &f%count%&7/&f%limit%"
  already-claimed: "&cDieser Chunk gehört bereits &e%owner%&c."
  claim-limit: "&cDu hast dein Claim-Limit erreicht."
  economy-unavailable: "&cDas Wirtschaftssystem ist nicht verfügbar."
  not-enough-money: "&cEin Claim kostet &e%cost%&c."
  not-claimed: "&cDieser Chunk ist nicht gesichert."
  not-owner: "&cNur &e%owner% &ckann diesen Claim verwalten."
  unclaimed: "&aDer Chunk ist jetzt wieder frei."
  save-failed: "&cDer Claim konnte nicht gespeichert werden."
  protected: "&cDieses Grundstück gehört &e%owner%&c."
  player-not-found: "&cDer Spieler muss online sein."
  trust-usage: "&7Verwendung: &f/claim trust <add|remove|list> [Spieler]"
  trust-owner: "&cDer Besitzer braucht keinen Trust-Eintrag."
  trust-added: "&a%player% darf diesen Chunk jetzt nutzen. (kostenlos)"
  trust-removed: "&e%player% darf diesen Chunk nicht mehr nutzen."
  trust-exists: "&e%player% &7ist bereits vertraut."
  trust-missing: "&e%player% &7ist diesem Claim nicht vertraut."
  settings-usage: "&7Verwendung: &f/claim settings <title|subtitle> <Text|reset>"
  setting-too-long: "&cTitel und Untertitel dürfen höchstens 80 Zeichen lang sein."
  setting-saved: "&aTitel/Untertitel gespeichert. Änderungen sind kostenlos."
  info: "&aClaim von &e%owner%&a. Vertraut: &f%trusted%"
  admin-usage: "&7Verwendung: &f/claim admin unclaim"
  admin-unclaimed: "&aClaim administrativ entfernt."
  help: "&a/claim &7Chunk sichern | &a/claim unclaim &7freigeben | &a/claim trust add <Spieler> &7vertrauen | &a/claim trust remove <Spieler> &7entfernen | &a/claim trust list | &a/claim settings <title|subtitle> <Text|reset> &7Anzeige ändern | &a/claim info"
