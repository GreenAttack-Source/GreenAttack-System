# Eigenständige Einstellungen für Teleport-Befehle.
enabled: true

permissions:
  request: "system.tpa"
  request-here: "system.tpa.here"
  auto: "system.tpa.auto"
  admin: "system.tpa.admin"
  teleport: "system.tp"
  teleport-here: "system.tp.here"

lookup:
  history-size: 100
  display-entries: 10

# Die Live-Spielerliste und serverübergreifende Teleports laufen über GreenAttack-System Velocity.
# Mit aktivierter Datenbank werden Anfragen, Auto-Annahme und Teleport-Verlauf backendübergreifend gespeichert.
# Dafür auf allen Paper-Backends dieselbe Datenbank und je Backend eine eindeutige server-id verwenden.
# Bei leerem jdbc-url werden host, port und name für MySQL verwendet.
# Für MariaDB jdbc-url im Format jdbc:mariadb://HOST:3306/DATENBANK eintragen.
database:
  enabled: false
  jdbc-url: ""
  host: ""
  port: 3306
  name: ""
  user: ""
  password: ""
  server-id: ""
  connection-timeout-ms: 3000

request:
  # 0 deaktiviert das automatische Ablaufen von Anfragen.
  expires-seconds: 0

buttons:
  accept: "&a[Annehmen]"
  deny: "&c[Ablehnen]"
button-separator: " &7| "

messages:
  disabled: "&cDieses Feature ist deaktiviert."
  no-permission: "&cDafür hast du keine Berechtigung."
  player-only: "&cDiesen Befehl können nur Spieler verwenden."
