  request-received: "&e%player% &amöchte sich zu dir teleportieren."
  request-here-received: "&e%player% &amöchte dich zu sich teleportieren."
  request-actions: "&a[Annehmen] &7| &c[Ablehnen]"
  request-accepted: "&aTeleport-Anfrage von &e%player% &aangenommen."
  request-accepted-by: "&e%player% &ahat deine Teleport-Anfrage angenommen."
  request-denied: "&cTeleport-Anfrage von &e%player% &cabgelehnt."
  request-denied-by: "&e%player% &chat deine Teleport-Anfrage abgelehnt."
  no-request: "&cDu hast keine offene Teleport-Anfrage."
