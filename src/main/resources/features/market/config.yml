enabled: true
category-layout-version: 2

permissions:
  use: "system.market.use"
  admin: "system.market.admin"

# Wenig Bestand erhöht den Preis; viel Bestand senkt ihn.
pricing:
  minimum-multiplier: 0.5
  maximum-multiplier: 2.0
  sell-ratio: 0.55

gui:
  default-category: mining
  category-title: "&2Markt &8» &7%category% &8(%page%/%pages%)"
  search-results-title: "&2Markt &8» &7Suche: %query% &8(%page%/%pages%)"
  category-click: "&eKlicke, um diese Kategorie zu öffnen."
  category-selected: "&aAusgewählt"
  sell-name: "&eZum Verkauf"
  sell-lore: "&7Öffnet das Verkaufsmenü."
  search-name: "&eItems suchen"
  search-lore: "&7Klicke, um den Suchtext einzugeben."
  search-title: "&2GreenAttack-Markt &8» &7Suche"
  search-placeholder: "&7Suchbegriff eingeben"
  search-result-name: "&aSuche: &f%query%"
  balance-name: "&aDein Kontostand"
  balance-lore: "&7Guthaben: &e%balance%"
  previous-name: "&e← Vorherige Seite"
  next-name: "&eNächste Seite →"
  offer-lore:
    - "&7Kaufpreis: &a%buy% &7pro Stück"
    - "&7Verkaufspreis: &c%sell% &7pro Stück"
    - "&7Marktbestand: &e%stock%"
    - ""
    - "&aLinksklick: 1 kaufen"
    - "&aShift + Linksklick: Stack kaufen"
    - "&cRechtsklick: 1 verkaufen"
    - "&cShift + Rechtsklick: alle verkaufen"

